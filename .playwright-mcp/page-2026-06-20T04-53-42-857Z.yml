        - paragraph [ref=e362]: Built for real movement. Quiet when it counts most.
        - heading "The RECON Chest Holster" [level=3] [ref=e363]
        - generic [ref=e364]:
          - paragraph [ref=e365]: The RECON Chest Holster was created for hunters, hikers, riders, and anyone who moves hard through the mountains. When backpacks, hip belts, heavy layers, and steep terrain make waist carry impossible, the RECON gives you a stable, silent, and custom-fit solution that stays ready no matter how far you push.
          - paragraph [ref=e366]: Where other chest holsters flop, squeak, or fight your draw, the RECON stays locked in. Wide 2" nylon straps distribute weight comfortably, while our QuietSide Technology uses leather connection points that flex naturally with your movement—zero creaking, zero noise, zero giveaway. An elastic rear panel adds dynamic tension to keep the holster tight to your body whether you're climbing, bushwhacking, or riding.
          - paragraph [ref=e367]: Every RECON is built around a firearm-specific shell with adjustable retention, suppressor-height sight clearance, and threaded-barrel compatibility. With a huge harness adjustment range, and color options let you dial in your exact setup.
          - paragraph [ref=e368]: The result? A chest holster you’ll forget you’re wearing—until the moment you need it.
          - heading "Key Features" [level=3] [ref=e369]:
            - strong [ref=e370]: Key Features
          - list [ref=e371]:
            - listitem [ref=e372]: Silent performance with QuietSide leather connection points
            - listitem [ref=e373]: Wide 2" straps for all-day comfort and stability
            - listitem [ref=e374]: Adjustable retention for a secure, custom-tuned draw
            - listitem [ref=e375]: Elastic rear section for dynamic fit under movement
            - listitem [ref=e376]: Custom-fit shells for specific firearm models
            - listitem [ref=e377]: Suppressor-height sight and threaded-barrel ready
            - listitem [ref=e378]: Multiple color options + accessory compatibility
            - listitem [ref=e379]: Massive size range on a single harness
            - listitem [ref=e380]: Built with premium nylon, leather, and hardware
            - listitem [ref=e381]: Lifetime warranty
          - paragraph [ref=e382]: Whether you're pushing ridge lines, scouting heavy cover, or running a backpack all day, the RECON keeps your firearm silent, secure, and instantly accessible—exactly where it should be.
