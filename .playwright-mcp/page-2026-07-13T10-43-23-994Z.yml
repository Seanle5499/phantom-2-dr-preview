  - generic [ref=f21e49]:
    - generic [ref=f21e50]: If you've carried 2+ years
    - heading "You Already Know Where This Goes." [level=2] [ref=f21e51]
    - generic [ref=f21e52]:
      - paragraph [ref=f21e53]: You bought a Kydex because every guy at the range told you to. Cheap. Rigid. Holds the gun.
      - paragraph [ref=f21e54]: Six months in, your hip started aching. You blamed your car seat. Your posture. An old injury. Not the holster.
      - paragraph [ref=f21e55]: A year in, the ache became a bruise. Then a callus. Then something duller that showed up in your lower back, on the opposite side of the gun.
      - paragraph [ref=f21e56]: Then you started leaving the gun at home. Not every day. Just the long days. The drive days. The days you knew you'd be sitting a lot.
      - paragraph [ref=f21e57]: That's not a holster problem anymore. That's a readiness problem — the exact thing carrying was supposed to solve.
    - generic [ref=f21e58]:
      - blockquote [ref=f21e59]: "\"I'm on holster #4 right now, and I know I still have at least a dozen more to go through before I find one that doesn't hurt.\""
      - generic [ref=f21e60]: — r/CCW
    - paragraph [ref=f21e62]: "You're not the only one. Right now there are threads on r/CCW from guys describing the same journey: buy the same holsters, get the same hip bruise, reach the same conclusion."
  - generic [ref=f21e64]:
