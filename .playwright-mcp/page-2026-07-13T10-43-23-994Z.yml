      - generic [ref=f21e135]:
        - paragraph [ref=f21e136]: "In 2015, Kevin — a Chicago veteran — needed a way to protect his family in a city where police response was measured in casualties. Every off-the-shelf IWB failed him: the discomfort, the printing, the plastic clips that cracked in summer."
        - paragraph [ref=f21e137]: "So he started modifying his own. Built around one question: how do you stay armed every day for 20 years without your body paying for it?"
        - paragraph [ref=f21e138]: His sons Mike and Musk joined him. What started as one man's solution became SouthEDC.
        - paragraph [ref=f21e139]: Today every Phantom 2.0 is handcrafted and QC-inspected in Greensboro, North Carolina. Not drop-shipped. Not white-labeled. Built by men who carry.
