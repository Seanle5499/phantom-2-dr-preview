    - heading "Phantom 2.0 Was Engineered To Stop The Pain At Its Source." [level=2] [ref=f21e66]
    - paragraph [ref=f21e67]: Four moves built into every Phantom — each one removes a specific cause of daily-carry discomfort.
    - generic [ref=f21e68]:
      - generic [ref=f21e69]:
        - generic [ref=f21e70]: 🛡️
        - heading "Full-Grip PU Foam Back" [level=4] [ref=f21e71]
        - paragraph [ref=f21e72]: Every inch touching your skin is soft PU leather foam — not rigid plastic. Distributes pressure across the whole contact patch instead of one line into your hip nerve.
      - generic [ref=f21e73]:
        - generic [ref=f21e74]: ⚙️
        - heading "Dual Metal Clips" [level=4] [ref=f21e75]
        - paragraph [ref=f21e76]: Two reinforced metal clips spread the weight across two belt anchor points. No single-clip load that shifts your SI joint. Won't crack in a hot car.
      - generic [ref=f21e77]:
        - generic [ref=f21e78]: 📏
        - heading "Slim Profile" [level=4] [ref=f21e79]
        - paragraph [ref=f21e80]: Ultra-thin, hip-hugging silhouette. No bulky hardware means no need to hunch or compensate with posture to hide it. Deep concealment, minimal visibility.
      - generic [ref=f21e81]:
        - generic [ref=f21e82]: ⚡
        - heading "Fast, Secure Draw" [level=4] [ref=f21e83]
        - paragraph [ref=f21e84]: Steel-riveted retention holds a medium draw — secure until you're ready, then an instant, audible click when holstered. Holds for years.
