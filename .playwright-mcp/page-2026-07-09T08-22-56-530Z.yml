                  - heading "Repeated Principles" [level=4] [ref=f20e9806]
                  - list [ref=f20e9807]:
                    - listitem [ref=f20e9810]:
                      - text: "Offers Are Your Strongest Growth Lever: An exceptional, logical offer can scale profitable customer acquisition even with bad ads or average web layouts. When plateaued, test the offer"
                      - 'button "398: We Hit $2M/month by Launching Multiple Ecom Offers" [ref=f20e9812] [cursor=pointer]':
                        - 'generic "398: We Hit $2M/month by Launching Multiple Ecom Offers" [ref=f20e9813]': "398"
                      - 'button "412: Watch this if you want to Scale #entrepreneur #entrepreneurship #businessowner" [ref=f20e9815] [cursor=pointer]':
                        - 'generic "412: Watch this if you want to Scale #entrepreneur #entrepreneurship #businessowner" [ref=f20e9816]': "412"
                      - text: .
                    - listitem [ref=f20e9819]:
                      - text: "Simple Offers Defeat Complex Ones: Over-engineered deals (e.g., confusing thresholds or multi-conditional discounts) confuse customers. Clear discount values like \"Flat 25% off sitewide\" or \"Buy X Get X Free\" are easily understood and convert best"
                      - 'button "327: How To Build Q4 Offers That Scale To $100k Per Day" [ref=f20e9821] [cursor=pointer]':
                        - 'generic "327: How To Build Q4 Offers That Scale To $100k Per Day" [ref=f20e9822]': "327"
                      - button [ref=f20e9824] [cursor=pointer]:
                        - img [ref=f20e9825]: more_horiz
                      - text: .
                    - listitem [ref=f20e9828]:
                      - text: "Include Hero Products in Sales: A major scaling bottleneck occurs when brands run site-wide promotions but exclude their best-selling products from the discount"
                      - 'button "321: How To Build Q4 Offers That Scale To $100k Per Day" [ref=f20e9830] [cursor=pointer]':
                        - 'generic "321: How To Build Q4 Offers That Scale To $100k Per Day" [ref=f20e9831]': "321"
                      - 'button "322: How To Build Q4 Offers That Scale To $100k Per Day" [ref=f20e9833] [cursor=pointer]':
                        - 'generic "322: How To Build Q4 Offers That Scale To $100k Per Day" [ref=f20e9834]': "322"
                      - text: .
                    - listitem [ref=f20e9837]:
                      - text: "Price Anchoring and Value Expansion: Use high-priced options to anchor visual value. Showing a premium, expensive single item makes curated bundles look much more cost-effective"
                      - 'button "361: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9839] [cursor=pointer]':
                        - 'generic "361: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9840]': "361"
                      - button [ref=f20e9842] [cursor=pointer]:
                        - img [ref=f20e9843]: more_horiz
                      - text: .
                    - listitem [ref=f20e9846]:
                      - text: "BOGO and Compounded Product Bundles: Encourage multi-unit purchases by bundling identical consumable products (such as supplements or skincare) or logically related items (such as a hairdryer and diffusers) rather than grouping random cross-sells"
                      - 'button "286: How To Setup Shopify Products SKUs For Conversions - Tutorial" [ref=f20e9848] [cursor=pointer]':
                        - 'generic "286: How To Setup Shopify Products SKUs For Conversions - Tutorial" [ref=f20e9849]': "286"
                      - button [ref=f20e9851] [cursor=pointer]:
                        - img [ref=f20e9852]: more_horiz
                      - text: .
                    - listitem [ref=f20e9855]:
                      - text: "Optimize the Psychological \"Peak\" via Post-Purchase Funnels: Post-purchase is the exact psychological climax of a buyer's excitement. Offering immediate, one-click upsells right after they check out triggers high acceptance rates without risking front-end conversion drops"
                      - 'button "352: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9857] [cursor=pointer]':
                        - 'generic "352: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9858]': "352"
                      - text: .
                    - listitem [ref=f20e9861]:
                      - text: "Upsells Must Address Logic, Not Emotion: Front-end ads convert based on emotion; back-end upsells convert on logic. Copy should outline how the upsell allows the customer to get the original result faster, cheaper, or with less effort"
                      - 'button "355: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9863] [cursor=pointer]':
                        - 'generic "355: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9864]': "355"
                      - 'button "357: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9866] [cursor=pointer]':
                        - 'generic "357: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9867]': "357"
                      - text: .
                    - listitem [ref=f20e9870]:
                      - text: "Differentiate Up to Percentage-offs vs. Flat Dollar Amounts: Structure your offer frames utilizing the \"Law of Large Numbers\"—always announce whichever numeric value looks larger to the consumer's eyes (e.g., \"$100 off\" vs. \"10% off\" a $1,000 item)"
                      - 'button "329: How To Build Q4 Offers That Scale To $100k Per Day" [ref=f20e9872] [cursor=pointer]':
                        - 'generic "329: How To Build Q4 Offers That Scale To $100k Per Day" [ref=f20e9873]': "329"
                      - button [ref=f20e9875] [cursor=pointer]:
                        - img [ref=f20e9876]: more_horiz
                      - text: .
                  - heading "Core Quotes" [level=4] [ref=f20e9879]
                  - list [ref=f20e9880]:
                    - listitem [ref=f20e9883]:
                      - text: "\"The offer is the most important thing. I could have terrible ads, I could have terrible everything, but if the offer is that good... people will buy.\" (Timestamps not provided)"
                      - 'button "398: We Hit $2M/month by Launching Multiple Ecom Offers" [ref=f20e9885] [cursor=pointer]':
                        - 'generic "398: We Hit $2M/month by Launching Multiple Ecom Offers" [ref=f20e9886]': "398"
                    - listitem [ref=f20e9889]:
                      - text: "\"We're building funnels, not upsells. Because the thing is, an upsell is like you just want them to say yes to this. When we build the funnel, we want them to say yes to this because we have something lined up after.\" (Timestamps not provided)"
                      - 'button "347: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9891] [cursor=pointer]':
                        - 'generic "347: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9892]': "347"
                      - 'button "353: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9894] [cursor=pointer]':
                        - 'generic "353: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9895]': "353"
                    - listitem [ref=f20e9898]:
                      - text: "\"If your front-end offer is like a $70 AOV, you could upsell up to $70... It doesn't have to be literally 80% off, it just has to make sense.\" (Timestamps not provided)"
                      - 'button "370: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9900] [cursor=pointer]':
                        - 'generic "370: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9901]': "370"
                    - listitem [ref=f20e9904]:
                      - text: "\"Rather than us saying 20% off or $16 off... we took that $16 and we added it to the savings with the markdown price... and then we were announcing that it was $36 off.\" (Timestamps not provided)"
                      - 'button "346: How to offer stack in Ecom. #ecom #motivation #motivational" [ref=f20e9906] [cursor=pointer]':
                        - 'generic "346: How to offer stack in Ecom. #ecom #motivation #motivational" [ref=f20e9907]': "346"
                  - heading "Practical Applications" [level=4] [ref=f20e9910]
                  - list [ref=f20e9911]:
                    - listitem [ref=f20e9914]:
                      - text: "Offer Stacking: If a product is evergreen-marked down from $100 to"
                      - generic [ref=f20e9919]: 80onyourShopifystore, andyourunanextra20
                      - text: 16 off) promotion, stack the savings in your ad creatives. Instead of advertising a basic "20% Off sale," advertise a combined "Save 36% Off" to capture the market's attention with a higher discount number
                      - 'button "346: How to offer stack in Ecom. #ecom #motivation #motivational" [ref=f20e9921] [cursor=pointer]':
                        - 'generic "346: How to offer stack in Ecom. #ecom #motivation #motivational" [ref=f20e9922]': "346"
                      - 'button "418: How I Scaled To $90k Per Day At a 6x ROAS On Shopify" [ref=f20e9924] [cursor=pointer]':
                        - 'generic "418: How I Scaled To $90k Per Day At a 6x ROAS On Shopify" [ref=f20e9925]': "418"
                      - text: .
                    - listitem [ref=f20e9928]:
                      - text: "Post-Purchase Funnel Sequencing: Install a dedicated post-purchase app like Aftersell to implement a sequence of 3 upsells and 2 downsells"
                      - 'button "367: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9930] [cursor=pointer]':
                        - 'generic "367: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9931]': "367"
                      - 'button "379: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9933] [cursor=pointer]':
                        - 'generic "379: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9934]': "379"
                      - text: . Place a gamified progress bar at the top of the upsell page to build momentum
                      - 'button "364: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9936] [cursor=pointer]':
                        - 'generic "364: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9937]': "364"
                      - 'button "365: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9939] [cursor=pointer]':
                        - 'generic "365: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9940]': "365"
                      - text: . For a single SKU model, inflate the price of the first upsell heavily to anchor the consumer, then follow a "no" with a downsell offering that same product at an irrefutable 70% discount
                      - 'button "360: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9942] [cursor=pointer]':
                        - 'generic "360: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9943]': "360"
                      - 'button "361: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9945] [cursor=pointer]':
                        - 'generic "361: Secrets behind 9-figure post purchase funnels on Shopify" [ref=f20e9946]': "361"
                      - text: .
                    - listitem [ref=f20e9949]:
                      - text: "Bundle Labeling: Avoid generic, tactical \"Buy 2\" labels. Instead, assign highly specific buyer labels to each bundle quantity (e.g., for a humidifier store, label the 1-pack \"Perfect for Studio Apartments\" and the 2-pack \"Great for 1-Bedroom Apartments\")"
