                    - listitem [ref=f20e9276]:
                      - text: "Angles Outperform Formats or Concepts: Consumers do not buy an ad because it is a \"3 reasons why\" style video; they buy because of the actual reasons presented. The marketing angle (the core reason to buy) is infinitely more important than the visual format"
                      - 'button "33: How I use ad angles to hit $100k/days" [ref=f20e9278] [cursor=pointer]':
