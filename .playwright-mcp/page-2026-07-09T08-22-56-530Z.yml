              - generic [ref=f20e10811]:
                - generic [ref=f20e10829]:
                  - button "Thoughts" [ref=f20e10832] [cursor=pointer]:
                    - generic [ref=f20e10835]: Thoughts
                    - img [ref=f20e10837]: expand_more
                  - heading "The 322 Manual Upload Protocol Over Flexible Ads" [level=2] [ref=f20e10840]
                  - generic [ref=f20e10843]: "Type: playbook Core insight: Meta's automated \"Flexible Ads\" format forces creatives into carousels and hides specific performance metrics. To ensure maximum data transparency, marketers must manually upload three individual creatives with their corresponding copy and headlines. This allows you to track exactly which asset captures spend and performance in the ad manager. Exact source video title: \"How To Run Facebook Ads To Hit $100k/Days - FREE COURSE\" Timestamp: not available Exact quote: \"we use a manual upload and this is where so many of you have defaulted to flexible ads to build the 322 strategy and I'm telling you this is a terrible idea and the reason why it's a terrible idea at least if you ask me is because you can't see the data and we need to see the data we want to see which creatives specifically are performing\" SouthEDC tactical EDC application: Manually upload three distinct image creatives showing a titanium multi-tool in different pocket layouts, using two specific primary texts and two headlines, instead of dumping them into one flexible ad, so you can clearly see which multi-tool visual Meta spends on. Wellness Nest wellness application: Manually set up three vertical video ads of a sleep tincture (one raw pour, one bedtime routine, one close-up ingredient shot) using the 322 structure to isolate and identify the exact winning creative variation. Confidence: high"
                  - separator [ref=f20e10845]
                  - heading "Concept vs. Angle (The Customer's \"Why\")" [level=2] [ref=f20e10848]
                  - generic [ref=f20e10851]: "Type: concept Core insight: A creative \"concept\" is an internal structural idea (e.g., \"Us vs. Them\" or \"3 Reasons Why\"), whereas the \"angle\" is the customer-centric reason why they choose to buy. True direct-response scaling is unlocked when you spend 80% of your time refining the customer's \"why\" rather than debating the ad format. Exact source video title: \"How I use ad angles to hit $100k/days\" Timestamp: not available Exact quote: \"concept is like what we want angles how we choose to sell the product are much more focused on the customer... the angle is more important than the concept because the angle is the reason why the person buys\" SouthEDC tactical EDC application: Move away from just a generic \"3 reasons why\" script format and test the specific angle of \"preventing metallic pocket bulge that tears through daily denim trouser pockets.\" Wellness Nest wellness application: Instead of just testing a split-screen comparison concept, focus on the angle of \"bypassing the afternoon cortisol crash without having to quit your morning ritual.\" Confidence: high"
                  - separator [ref=f20e10853]
                  - heading "Copywriting for Direct Visual Imagery" [level=2] [ref=f20e10856]
                  - generic [ref=f20e10859]: "Type: concept Core insight: Outstanding copy is highly visual. By using words that trigger pre-existing subconscious mental models, you can create a vivid, relatable visual in the customer's head instantly without needing to show a complex, expensive graphic. Exact source video title: \"Steal My $100k/Day Winning Ad Checklist\" Timestamp: not available Exact quote: \"does the copywriting on this ad create a clear image for the user... cleaner than Mr Clean you automatically probably have an image in your mind of Mr Clean with his bald head and you know the magic clean eraser... that automatically put a visual in your head\" SouthEDC tactical EDC application: Write the headline: \"Slices through thick climbing ropes like a surgical scalpel\" for a folding pocket knife, forcing the buyer to visualize an effortless, razor-sharp cut. Wellness Nest wellness application: Use the hook: \"Feels like waking up inside a quiet, rain-scented mountain cabin\" for a magnesium sleep spray to trigger an immediate sensory mental image of crisp relaxation. Confidence: high"
                  - separator [ref=f20e10861]
                  - heading "Creating Attention and Relatability with Emojis" [level=2] [ref=f20e10864]
                  - generic [ref=f20e10867]: "Type: concept Core insight: Witty, wordy headlines can sometimes distract the user from the primary benefit. Replacing long text chains with intuitive emojis allows you to bypass cognitive load, letting the consumer make immediate, positive visual associations in a fraction of a second. Exact source video title: \"The Emoji Ad style. #ecom #motivation #motivational\" Timestamp: not available Exact quote: \"so many people use emojis nowadays and so just letting the emoji do the explaining is a great way to grab the attention... we're letting the emojis do the talking here and we're letting people really kind of make their own assumptions\" SouthEDC tactical EDC application: Show a split-screen image: a bulky, disorganized metal ring labeled with 🤯 on the left, and a sleek, silent carbon key organizer labeled with ⭐️ on the right. Wellness Nest wellness application: Create a static image showing a stressed silhouette with a 🧠 chaotic scribble icon, contrasting it with a peaceful, calm silhouette holding a herbal tea labeled with a 🍃 star-eye icon. Confidence: high"
                  - separator [ref=f20e10869]
                  - heading "Creating Curiosity via Juxtaposition" [level=2] [ref=f20e10872]
                  - generic [ref=f20e10875]: "Type: playbook Core insight: Juxtaposition is placing two contrasting or logically incompatible ideas together. This creates a severe cognitive friction point (an information gap) that forces the viewer to pause their scroll to resolve the logical loop. Exact source video title: \"How to write hooks that stop 50% of scrolls\" Timestamp: not available Exact quote: \"putting two things that don't go together... toxic and natural Like those don't go together Like how does an allnatural deodorant perform like a toxic one right?... we're doing so much by putting two things that don't go together and doing it creatively\" SouthEDC tactical EDC application: Run a hook displaying: \"The credit-card-sized tool kit that performs like an industrial toolbox.\" The contrast of ultra-compact size and heavy mechanical utility drives immediate click-through intent. Wellness Nest wellness application: Run a hook stating: \"The raw organic sleep tonic that knocks you out like a prescription sedative.\" This pairs natural purity with clinical strength, forcing the anxious insomniac to stop and read. Confidence: high"
                  - separator [ref=f20e10877]
                  - heading "Curiosity through Ethical Fear" [level=2] [ref=f20e10880]
                  - generic [ref=f20e10883]: "Type: concept Core insight: Evolutionarily, the human brain is hardwired to react to potential danger to guarantee survival. Structuring hooks around ethical, research-backed warnings (e.g., hidden chemical fillers or red flags) triggers a protective subconscious response, capturing attention much faster than a standard benefit claim. Exact source video title: \"How to write hooks that stop 50% of scrolls\" Timestamp: not available Exact quote: \"watch out for these ingredients when buying shampoo... our kind of monkey brain our you know our default like subconscious is like I need to make sure that I'm not in danger... watch out for these ingredients is going to get someone to stop and make sure that they are not in danger\" SouthEDC tactical EDC application: Test a static image of a standard pocket knife clip with a bold warning note: \"Check your knife clip today: Two silent design flaws that cause everyday knives to slide out of your pocket unnoticed.\" Wellness Nest wellness application: Create a video hook showing three vitamin bottles under the text: \"Three toxic chemical binders hiding inside your daily multivitamin that are secretly damaging your stomach lining.\" Confidence: high"
                  - separator [ref=f20e10885]
                  - heading "Logical Authority through Fact Delivery" [level=2] [ref=f20e10888]
                  - generic [ref=f20e10891]: "Type: playbook Core insight: True authority is established through the delivery of logically sound, research-backed information. Presenting matter-of-fact statistics or biological realities bypasses consumer skepticism and instantly positions your brand as an educational expert. Exact source video title: \"How to effortlessly create authority in your ecom ads\" Timestamp: not available Exact quote: \"if you provide someone with new information that logically makes sense you are going to establish yourself as an authority... now not only are we speaking in matter of facts versus matter of opinions we are again establishing ourselves... as an authority by again the word choice\" SouthEDC tactical EDC application: Create an ad overlay stating: \"94% of tactical flashlights lose half of their lumen brightness within the first 10 minutes due to heat voltage drop. Here is the physical copper mechanism we built to prevent that.\" Wellness Nest wellness application: Use a bold headline hook stating: \"Why 73% of standard probiotic supplements never actually pass your stomach acid alive.\" This provides clinical educational value that builds immediate purchase trust. Confidence: high"
                  - separator [ref=f20e10893]
                  - heading "The Podcast Environment Authority Hack" [level=2] [ref=f20e10896]
                  - generic [ref=f20e10899]: "Type: playbook Core insight: Subconscious patterns drive human trust. Placing a speaker in an environment that mimics a high-status interview—specifically sitting in front of a studio podcast microphone—automatically signals credibility, expert status, and authentic peer-reviewed advice to the viewer. Exact source video title: \"How to effortlessly create authority in your ecom ads\" Timestamp: not available Exact quote: \"this guy just by sitting in front of a mic automatically looks like an authority... your environment and how you appear visually also creates an authority... by this guy just being positioned in front of a mic and looking like he is on a podcast being an authority it automatically creates this authority\" SouthEDC tactical EDC application: Have an EDC gear designer breakdown multi-tool metallurgy while sitting at a dark industrial desk, speaking directly into a professional studio podcast mic. Wellness Nest wellness application: Film a health coach explaining the direct biological connection between cortisol spikes and gut bloating, shot from an angled perspective with a clear podcast microphone in the foreground. Confidence: high"
                  - separator [ref=f20e10901]
                  - heading "Native Camouflage Review Ads" [level=2] [ref=f20e10904]
                  - generic [ref=f20e10907]: "Type: concept Core insight: Native ads (camouflage ads) bypass the user's commercial defenses because they look like raw, organic feed content. Authentic reviews and real text-heavy customer testimonials written in raw, conversational language build belief far better than highly produced ad graphics. Exact source video title: \"The problem with Native ads in 2026 #ecom #motivation #motivational\" Timestamp: not available Exact quote: \"native ads were actually originally... just reviews from real customers... they're camouflage right they don't look like ads and so people bring their guard down... all this is doing is it's just building belief\" SouthEDC tactical EDC application: Run a static image of a scratched-up minimalist wallet sitting casually on a truck tailgate, accompanied by a raw copy-pasted text review: \"I’ve run this titanium wallet over twice with my F-150 and it didn't even bend a single card. Unbelievable.\" Wellness Nest wellness application: Use a screenshot of a real iMessage chat showing a user telling their friend: \"My stomach bloating completely cleared up in 4 days after drinking this herbal mix.\" Run it as an unedited static image. Confidence: high"
                  - separator [ref=f20e10909]
                  - heading "Writing Copy \"In the Environment\"" [level=2] [ref=f20e10912]
                  - generic [ref=f20e10915]: "Type: playbook Core insight: Do not write direct-response copy in a plain Google Doc. Headlines, layouts, and visual hierarchy must be crafted directly \"in the environment\" (inside a 9x6 mobile vertical canvas or static template) so you can visually verify how the copy, fonts, and product imagery interact to capture attention. Exact source video title: \"How To Turn Research Into Winning Meta Ads (just copy me)\" Timestamp: not available Exact quote: \"when you write headlines like this in a Google doc you are not writing in the environment... write in a 9 by6 so we could see exactly how the ad is going to look because big shout out to Harry Dry your copy is like food okay how it looks matters\" SouthEDC tactical EDC application: Design a 9x6 static ad inside Canva, arranging the headline \"The last minimalist wallet you'll buy\" so it sits exactly above a crisp hand-model photo showing how cards fan out, ensuring zero visual clutter. Wellness Nest wellness application: Write the callout \"Organic Greens with zero sugar\" directly on a 9x6 vertical graphic showing a rich green powder being scooped into clean water, ensuring the text directly aligns with the visual action. Confidence: high"
                  - separator [ref=f20e10917]
                  - heading "The Raw Start Video Splicing Hack" [level=2] [ref=f20e10920]
                  - generic [ref=f20e10923]: "Type: playbook Core insight: You do not always need to write new script angles. Changing the raw hook by trimming or shifting the starting point by just 3 seconds to put immediate action or a crisp visual transition first can completely alter Meta's budget spend allocation and revive dead ad performance. Exact source video title: \"The Instagram Reel Strategy\" Timestamp: not available Exact quote: \"sometimes just cutting a video slightly and changing the starting point has actually been the difference from an ad getting $0 in spend to an ad being able to scale over $2,000 a day a 3second edit... sometimes it's better to work smarter than it is to work harder\" SouthEDC tactical EDC application: Take a 30-second video of an EDC wallet and cut it three ways: version one starts with a satisfying metallic snap, version two starts with sliding cards out, and version three starts with the unboxing. Test all three start-times in one campaign. Wellness Nest wellness application: Take a raw recipe clip for a gut-health powder and slice the starting frame to begin directly with the satisfying fizzing pour rather than the slow prep steps. Confidence: high"
                  - separator [ref=f20e10925]
                  - heading "The \"Ugly Ad\" Feed-Mimicry Principle" [level=2] [ref=f20e10928]
                  - generic [ref=f20e10931]: "Type: concept Core insight: Super-polished, studio-produced creative assets frequently underperform because they immediately register as transactional advertisements. \"Ugly\" ads shot on standard phone cameras without fancy graphics look like organic peer content, prompting viewers to keep their guard down. Exact source video title: \"Why Worse Products Are Beating You on Facebook (And How to Fix It)\" Timestamp: not available Exact quote: \"I can guarantee you that the ugly quote unquote ugly ugly ads will outperform super polished ads eight out of 10 times... because they look like an organic piece of content that is on social media... that's why those ads do well\" SouthEDC tactical EDC application: Film a shaky, unedited 10-second vertical clip using a multi-tool to open a stubborn plastic package on a messy workbench in a garage. Wellness Nest wellness application: Post a simple, slightly out-of-focus phone picture of a powder bottle sitting open on a kitchen counter next to a messy breakfast, with raw text overlay explaining the taste. Confidence: high"
                  - separator [ref=f20e10933]
                  - heading "Taking Broad Swings under Andromeda" [level=2] [ref=f20e10936]
                  - generic [ref=f20e10939]: "Type: playbook Core insight: Meta's modern Andromeda algorithm groups highly similar creative testing assets together, starving micro-iterations of spend. To force Meta to allocate spend and test cleanly, initial concepts must take massive, macro-creative swings (different angles, distinct avatars, or completely different visual hooks) rather than tiny headline tweaks. Exact source video title: \"How I make Facebook ads that scale to $50k/day\" Timestamp: not available Exact quote: \"what we would do before is we would choose one of these four variables... and we would only choose one thing to test... Old Spencer is a bit of an idiot and so what you're actually doing now is correct... we are taking bigger Swings with our initial ad Concepts because by doing that we can start to narrow down at least what is working congruently\" SouthEDC tactical EDC application: When launching a tactical pen, test three massive concept angles: one showing emergency glass shattering (survival/tactical), one showing a premium bolt-action click (sensory/aesthetic), and one showing raw material strength under a hydraulic press (durability). Wellness Nest wellness application: Test three completely different focus areas for a botanical blend: one ad targeting severe hormone bloating, one targeting deep anxiety relief, and one targeting morning focus/cognitive performance. Confidence: high"
                  - separator [ref=f20e10941]
                  - heading "The Deconstructive Growth Loop Strategy" [level=2] [ref=f20e10944]
                  - generic [ref=f20e10947]: "Type: checklist Core insight: True creative scaling is built on systematic feedback loops. Marketers must review the explicit strategy and physical execution of both winning and losing ads. Instead of guessing, look for missing core components—objections handled, structural mechanisms, presence of authority, and avatar specific relevance—to formulate the next test hypothesis. Exact source video title: \"Revealing The Only Growth Hack For Facebook Ads\" Timestamp: not available Exact quote: \"you need to review the strategy behind each and every single ad that you create winner or loser... review the executions of your ad... take the learnings and apply them to the next round of creatives\" SouthEDC tactical EDC application: Review a failed minimalist wallet ad. Identify if the product mechanism was unclear or if you had brand bias. Plan the next iteration by physically demonstrating the quick-access card slide in the first 2 seconds. Wellness Nest wellness application: Analyze an organic greens ad that didn't get spend. Note if you failed to show the actual greens blend in action or if the text was too feature-heavy. Rewrite the script to start directly with the customer's daily digestion routine. Confidence: high"
                  - separator [ref=f20e10949]
                  - heading "The \"Unaware\" Third-Person Story Hook" [level=2] [ref=f20e10952]
                  - generic [ref=f20e10955]: "Type: playbook Core insight: To capture a massive Total Addressable Market (TAM), scale with unaware ads that tell third-person educational or historical stories. Bypassing direct product promotion in the first 40 seconds builds high curiosity and hooks a general viewer before gracefully bridging to your solution. Exact source video title: \"Unaware Ads: How to Legally Print Money in eCom\" Timestamp: not available Exact quote: \"you're almost telling it from a third person's perspective... go and look at someone else's story and let that and just retell the story in a way that is interesting and again creates curiosity... we don't show the product up until like maybe like 40 50 seconds in the ad\" SouthEDC tactical EDC application: Begin a video showing historical b-roll of high-altitude mountain climbers in 1953: \"This is the exact material Everest climbers used when their gear froze. It's titanium grade 5.\" Introduce your lightweight titanium EDC compass at the 45-second mark. Wellness Nest wellness application: Start an ad telling the story of an ancient Central American tribe: \"For over 800 years, this isolated tribe used a single wild adaptogen root as a natural cognitive energizer.\" Bridge to your brand's natural focus gummies near the end. Confidence: high"
                  - separator [ref=f20e10957]
                  - heading "The Law of Unconscious Creative Ideation" [level=2] [ref=f20e10960]
                  - generic [ref=f20e10963]: "Type: concept Core insight: Creative copywriting cannot be forced under a short timer or strict rules. To unlock breakthrough ad ideas, marketers must deeply study customer behavior and Reddit review threads first, and then allow that raw data to naturally incubate in the subconscious mind during routine, low-stress daily tasks. Exact source video title: \"From $2k/Day to $160k/Day in 30 Days\" Timestamp: not available Exact quote: \"when you do research you don't want to write the script then you want to let it like settle and like incubate for a bit because that's when you get the ideas... that's when you have like the breakthrough moments\" SouthEDC tactical EDC application: Spend two hours reading Reddit threads on \"keys tearing pants pockets.\" Close the laptop, do a workout or wash the dishes, and let your subconscious naturally design an angle targeting key pocket protection. Wellness Nest wellness application: Analyze deep customer feedback surveys about morning brain fog. Let the qualitative data marinate overnight, and wake up to write a highly relatable script hook about dragging yourself out of bed. Confidence: high"
                  - separator [ref=f20e10965]
                  - heading "Editor Briefs with Strategic Breakdowns" [level=2] [ref=f20e10968]
                  - generic [ref=f20e10971]: "Type: playbook Core insight: Direct-response video editors cannot operate as simple automated tools. To make high-intent ads that scale, briefs must include a \"strategic breakdown\" section that explains the core marketing psychology, targeted buyer avatar, and precise emotional triggers behind every scene transition. Exact source video title: \"We Got 1,078 Customers To Create Facebook Ads\" Timestamp: not available Exact quote: \"in our briefs that we sent to the editors... we started implementing something called strategic breakdown and this... basically explains the thinking and the reasoning behind the script and like it explains... we want to evoke these emotions... and we got feedback from our editors that it's extremely helpful\" SouthEDC tactical EDC application: Add a \"Strategic Goal\" note to your tactical pen editor brief: \"This 3-second macro visual of the glass breaker tip is designed to address the customer's core belief that safety gear is too bulky to carry in an office environment.\" Wellness Nest wellness application: Include a psychological note in a magnesium brief: \"The pacing of this scene transition must remain slow and relaxing to match the high-wellness/low-intensity sleep emotional state we are evoking.\" Confidence: high"
                  - separator [ref=f20e10973]
                  - heading "Shedding Ego to Let Direct Performance Decide" [level=2] [ref=f20e10976]
                  - generic [ref=f20e10979]: "Type: quote Core insight: Shed your creative ego completely. Your personal artistic preference or visual aesthetic has absolutely zero correlation with direct-response ad performance. Let the real auction spend and actual conversion data define what is \"good\" or \"bad.\" Exact source video title: \"The only way you’ll actually scale to $100k/day in ecom\" Timestamp: not available Exact quote: \"you need to show shed your ego and you need to stop looking at things from the lens that you currently have... a great ad creative is an ad creative that actually performs... good is ads that perform bad is ads that don't perform period\" SouthEDC tactical EDC application: If an expensive, highly polished cinematic trailer for a pocket tool gets zero spend in a CBO test, but a simple 8-second video of someone scratching a lottery ticket with it sucks up all the budget, immediately scale the raw scratching video. Wellness Nest wellness application: Turn off your highly styled, professionally animated supplement ingredient sequence if it fails to convert, and let Meta direct the ad budget to a raw phone photo of the supplement jar. Confidence: high"
                  - separator [ref=f20e10981]
                  - heading "The POV / Text Wall Ad Layout" [level=2] [ref=f20e10984]
                  - generic [ref=f20e10987]: "Type: playbook Core insight: The POV caption style overlays a highly relatable, text-based daily scenario directly on top of raw visual proof showing the customer's dream outcome. This captures attention by visually establishing a direct personal identity with the viewer. Exact source video title: \"Facebook ad formats that scale\" Timestamp: not available Exact quote: \"the format is called the POV or text wall style ad and all you're simply doing is calling out exactly what your specific Avatar wants and putting POV in front of it... it's going to help show them a glimpse of what their life could look like by making the decision to actually purchase\" SouthEDC tactical EDC application: Create an image ad showing a clean, organized, featherlight pocket layout with the text wall: \"POV: You finally dumped your bulky, heavy wallet and switched to an ultra-thin carbon fiber EDC carrier.\" Wellness Nest wellness application: Run a video of a person waking up looking vibrant and happy with the bold text overlay: \"POV: You finally realized that fixing your sleep hormone balance matters 10x more than drinking another cup of coffee.\" Confidence: high"
                  - separator [ref=f20e10989]
                  - heading "Pet Integration to Boost Visual Hook Rates" [level=2] [ref=f20e10992]
                  - generic [ref=f20e10995]: "Type: playbook Core insight: Incorporating cute pets or domestic animals in the direct-response hook or background is an incredibly consistent way to naturally stop a user's feed scroll. It lowers customer sales resistance, drives high native engagement, and organically raises overall hook rates. Exact source video title: \"My 5 Winning Facebook Ad Creatives\" Timestamp: not available Exact quote: \"by including animals or really cute pets or dogs or cats inside of your ads you more often times than not will see actual better conversions in your ad account by having the pet in the background... an incredible way to incorporate animals and cute pets in your ads\" SouthEDC tactical EDC application: Film an unboxing of a rugged titanium multi-tool on a wooden table while a friendly German Shepherd sits in the background, looking directly into the camera lens. Wellness Nest wellness application: Record an morning organic greens mixing video with a cat sitting peacefully next to the glass, evoking warm, natural household wellness. Confidence: high"
