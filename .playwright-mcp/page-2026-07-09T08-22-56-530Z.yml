                    - listitem [ref=f20e9312]:
                      - text: "Establish Logical Authority: True authority in an ad doesn't require a white lab coat. Presenting logical, research-backed information or placing a speaker in an authoritative environment (like sitting in front of a podcast mic) automatically registers trust in the consumer's subconscious"
