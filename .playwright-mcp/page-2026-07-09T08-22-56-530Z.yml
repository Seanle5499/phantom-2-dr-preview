              - 'heading "For the topic \"Creative Strategy, Copywriting, & Ad Production\", extract 20 atomic notes. For each note, use this exact format: [Title] Type: concept / playbook / quote / checklist Core insight: ... Exact source video title: ... Timestamp: ... Exact quote: ... SouthEDC tactical EDC application: ... Wellness Nest wellness application: ... Confidence: high / medium / low Only include ideas clearly supported by the transcripts. If timestamp or quote is missing, say \"not available\". Prioritize ad creative, hooks, angles, UGC, copywriting, scroll-stopping attention, proof, authority, and native/static ad production." [level=3] [ref=f20e10803]':
                - paragraph [ref=f20e10804]: For the topic "Creative Strategy, Copywriting, & Ad Production", extract 20 atomic notes.
                - paragraph [ref=f20e10805]: "For each note, use this exact format:"
                - heading "[Title]" [level=2] [ref=f20e10806]
                - paragraph [ref=f20e10807]: "Type: concept / playbook / quote / checklist Core insight: ... Exact source video title: ... Timestamp: ... Exact quote: ... SouthEDC tactical EDC application: ... Wellness Nest wellness application: ... Confidence: high / medium / low"
