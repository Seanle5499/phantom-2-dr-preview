                      - text: .
                    - listitem [ref=f20e9285]:
                      - text: "Show, Don't Just Tell: High-performing ads display the product's unique mechanism or primary benefit physically in action—especially in the first 3 to 5 seconds—rather than just talking about it"
                      - 'button "95: This Ad Generated Over $680k For This Brand (steal it)" [ref=f20e9287] [cursor=pointer]':
