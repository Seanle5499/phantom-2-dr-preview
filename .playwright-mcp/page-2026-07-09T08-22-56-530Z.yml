                    - listitem [ref=f20e9294]:
                      - text: "Target Psychological Desires over Demographics: Demographics (e.g., age, gender) don't dictate what copy to write. Winning copy targets foundational human desires—such as taking control, optimizing health, or boosting status—and handles the avatar's core beliefs"
                      - 'button "99: 7 Figure CEO Answers Questions From Shopify Brands" [ref=f20e9296] [cursor=pointer]':
