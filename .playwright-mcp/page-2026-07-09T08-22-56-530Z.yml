                    - listitem [ref=f20e9576]:
                      - text: "CRO is Customer-Journey Optimization, Not Surface Tweaks: Real CRO is about making sure the customer has all the logical information they need to comfortably purchase, rather than simply swapping button colors or themes"
                      - 'button "122: $6,258,440 in 180 days with CRO - How To ACTUALLY do CRO for DTC Brands" [ref=f20e9578] [cursor=pointer]':
