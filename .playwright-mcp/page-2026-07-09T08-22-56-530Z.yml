                      - text: .
                    - listitem [ref=f20e9585]:
                      - text: "Above the Fold is Your Primary Salesperson: Since 100% of landing traffic views above the fold and scroll fatigue hits quickly, this space must communicate a clean layout, social proof, clear product imagery, and a highly visible call-to-action"
