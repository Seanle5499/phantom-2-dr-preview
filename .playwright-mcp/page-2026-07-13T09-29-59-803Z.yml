  - generic [ref=f16e201]:
    - heading "How Carriers Thrived Before The Industry Started Selling Comfort As An Afterthought" [level=2] [ref=f16e202]
    - generic [ref=f16e203]:
      - paragraph [ref=f16e204]: "Holsters have always been built around one job: retention. Comfort was whatever was left over."
      - paragraph [ref=f16e205]:
        - text: But in the last decade, daily carry changed. The average CCW permit holder is now roughly 50 years old
        - superscript [ref=f16e206]: "1"
        - text: — and climbing. The bodies carrying today are 10-15 years older than the bodies Kydex was designed for in the 1990s.
      - heading "Why? Because the industry optimized for retention specs, not for the body wearing the holster." [level=3] [ref=f16e207]
      - paragraph [ref=f16e208]: They're focused on keeping you buying the next holster, not engineering the one that solves the root cause.
    - generic [ref=f16e209]:
      - generic [ref=f16e210]:
        - generic [ref=f16e211]: "1"
        - heading "Hip Nerve Compression" [level=4] [ref=f16e212]
        - paragraph [ref=f16e213]:
          - text: The lateral cutaneous femoral nerve runs under where a 4 o'clock Kydex sits. Compressed daily, it causes "meralgia paresthetica."
          - superscript [ref=f16e214]: "2"
      - generic [ref=f16e215]:
        - generic [ref=f16e216]: "2"
        - heading "SI Joint Misalignment" [level=4] [ref=f16e217]
        - paragraph [ref=f16e218]:
          - text: Uneven single-clip load shifts the sacroiliac joint out of alignment over time — a known driver of chronic lower back pain.
          - superscript [ref=f16e219]: "3"
      - generic [ref=f16e220]:
        - generic [ref=f16e221]: "3"
        - heading "Postural Compensation" [level=4] [ref=f16e222]
        - paragraph [ref=f16e223]:
          - text: To hide printing, carriers unconsciously hunch. Over months this collapses lumbar curvature — "flat back syndrome."
          - superscript [ref=f16e224]: "4"
      - generic [ref=f16e225]:
        - generic [ref=f16e226]: "4"
        - heading "Abdominal Wall Strain" [level=4] [ref=f16e227]
        - paragraph [ref=f16e228]:
          - text: "Appendix carriers: constant pressure on the inguinal ligament can aggravate or accelerate hernias."
          - superscript [ref=f16e229]: "5"
    - generic [ref=f16e230]:
      - paragraph [ref=f16e231]: None of these injuries show up on day one. All of them show up on year three.
      - paragraph [ref=f16e232]: Phantom 2.0 was engineered to break that pattern at year zero — full-grip PU foam distributes force across the contact patch, dual clips cut lateral load in half, and a slim profile removes the need to compensate with posture.
    - paragraph [ref=f16e233]: "*Copy frames CCW-related discomfort as an ergonomic/biomechanical issue. Does not diagnose, treat, or promise to cure any condition. Consult a medical professional for persistent pain."
