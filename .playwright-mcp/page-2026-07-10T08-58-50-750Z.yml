    - generic [ref=f35e385]:
      - heading "EFFORTLESSLY CARRY ALL DAY" [level=2] [ref=f35e386]
      - paragraph [ref=f35e388]: Your gun does no good sitting at home, but with most holsters biting into your side and leaving you exposed, we understand why you don't carry. That's why the Phantom 2.0 IWB Holster prioritizes comfort by pulling all edges away from the body and hand-buffing them to silky-smooth perfection, all while maintaining an ultra-thin profile for hip-hugging concealment
    - generic [ref=f35e396]:
      - heading "Instant Access Anytime, Anywhere With A Flick Of The Wrist" [level=2] [ref=f35e397]
      - paragraph [ref=f35e399]: Precision built with premium American materials and our engineered breakout channel that lets you draw instantly with the flick of the wrist even when you’re pinned or overpowered. Designed slim and comfortable for all day carry so you are always ready, whether alone, with your kids, or facing the unexpected.
