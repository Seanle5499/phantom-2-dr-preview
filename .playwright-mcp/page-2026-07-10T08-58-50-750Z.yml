      - heading "Veteran Owned, Family Built, And Purpose Driven." [level=2] [ref=f35e408]
      - generic [ref=f35e409]:
        - paragraph [ref=f35e410]: In 2015, Kevin and his sons, Mike and Musk, moved to Chicago, where protecting his family became essential. Frustrated with bulky holsters, he began modifying and eventually building his own — leading to the breakout channel for lightning-fast draw speeds. The design quickly gained popularity locally.
        - paragraph [ref=f35e411]: Now, over 10 years later, SouthEDC remains proudly veteran-owned and family-operated, handcrafting premium holsters in Greensboro, North Carolina.
